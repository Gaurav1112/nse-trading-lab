[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-trading-lab"
version = "1.0.0"
description = "NSE/BSE backtesting + scoring + screener with hardened cost model and Streamlit UI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "NSE Trading Lab" }]
dependencies = [
    "yfinance>=0.2.40,<0.3",
    "pandas>=2.1,<2.3",
    "numpy>=1.24,<2.3",
    "matplotlib>=3.7,<4",
    "ta>=0.11.0,<0.12",
    "streamlit>=1.32,<2",
    "pyarrow>=14,<19",
    "plotly>=5.18,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6"]

[project.scripts]
nse-lab = "app:main"

[tool.setuptools.packages.find]
include = ["nse_backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
