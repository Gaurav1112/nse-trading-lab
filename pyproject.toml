[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-trading-lab"
version = "1.0.0"
description = "NSE/BSE backtesting + scoring + screener with hardened cost model and Streamlit UI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "NSE Trading Lab" }]
# Dependency ranges MUST stay in sync with requirements.txt — pip uses
# requirements.txt for deploys (Streamlit Cloud) but ``pip install -e .`` and
# downstream packagers use these. Drift causes non-reproducible installs.
dependencies = [
    "yfinance>=0.2.40,<0.3",
    "pandas>=2.1,<2.4",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "ta>=0.11.0,<0.12",
    "streamlit>=1.32,<2",
    "pyarrow>=14,<22",
    "plotly>=5.18,<7",
    "fyers-apiv3>=3.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6"]

[project.scripts]
nse-lab = "app:main"

[tool.setuptools]
packages = ["nse_backtest", "nse_backtest.intraday", "nse_backtest.features", "nse_backtest.model", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
