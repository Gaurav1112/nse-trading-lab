name: Tape Flip Alert

on:
  schedule:
    # 13:00 UTC = 18:30 IST. After Daily Tape Report (12:30 UTC) commits.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tape-flip detector
        id: flip
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/check_tape_flip.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Open issue on flip
        if: steps.flip.outcome == 'failure' && hashFiles('tape_flip_body.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('tape_flip_body.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[Tape Flip] ${today}`,
              body,
              labels: ['tape-flip'],
            });
