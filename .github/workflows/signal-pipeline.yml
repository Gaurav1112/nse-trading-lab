name: signal-pipeline
on:
  schedule:
    # NSE 09:15–15:30 IST = 03:45–10:00 UTC, Mon–Fri
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: signal-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check pipeline secrets
        id: gate
        env:
          SIGNALS_REPO_URL: ${{ secrets.SIGNALS_REPO_URL }}
          DEPLOY_KEY: ${{ secrets.SIGNALS_DEPLOY_KEY }}
        run: |
          # Without the signals repo there is nothing to run: skip cleanly instead of failing every 5 minutes.
          # Exactly one of the two secrets set is a misconfiguration, not "not set up yet": fail loudly.
          if [ -z "$SIGNALS_REPO_URL" ] && [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::signal-pipeline skipped: set the SIGNALS_REPO_URL and SIGNALS_DEPLOY_KEY secrets to enable it"
          elif [ -z "$SIGNALS_REPO_URL" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::error::signal-pipeline misconfigured: only one of SIGNALS_REPO_URL and SIGNALS_DEPLOY_KEY is set"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code repo
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Setup SSH for signals repo
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SIGNALS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/signals_key
          chmod 600 ~/.ssh/signals_key
          echo "Host github-signals" >> ~/.ssh/config
          echo "  HostName github.com" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/signals_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Clone signals repo
        if: steps.gate.outputs.configured == 'true'
        env:
          SIGNALS_REPO_URL: ${{ secrets.SIGNALS_REPO_URL }}
        run: |
          # Rewrite SSH host to use our aliased key
          SIGNALS_SSH="${SIGNALS_REPO_URL/git@github.com/git@github-signals}"
          git clone "$SIGNALS_SSH" /tmp/signals

      - name: Run pipeline
        if: steps.gate.outputs.configured == 'true'
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          VAPID_PRIVATE_KEY_PEM: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
          SIGNALS_REPO_PATH: /tmp/signals
        run: python -m pipeline.run
