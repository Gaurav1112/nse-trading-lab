name: heartbeat
on:
  schedule:
    # Every 15 min during market hours + 30 min buffer
    - cron: '*/15 3-11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check pipeline secrets
        id: gate
        env:
          SIGNALS_REPO_URL: ${{ secrets.SIGNALS_REPO_URL }}
          DEPLOY_KEY: ${{ secrets.SIGNALS_DEPLOY_KEY }}
        run: |
          # Nothing to watch until the signals repo is configured: skip cleanly instead of failing every 15 minutes.
          # Exactly one of the two secrets set is a misconfiguration, not "not set up yet": fail loudly.
          if [ -z "$SIGNALS_REPO_URL" ] && [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::heartbeat skipped: set the SIGNALS_REPO_URL and SIGNALS_DEPLOY_KEY secrets to enable it"
          elif [ -z "$SIGNALS_REPO_URL" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::error::heartbeat misconfigured: only one of SIGNALS_REPO_URL and SIGNALS_DEPLOY_KEY is set"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Python
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pywebpush
        if: steps.gate.outputs.configured == 'true'
        run: pip install "pywebpush>=1.14.0,<3" "py-vapid>=1.9.0,<2" "requests>=2.32.4,<3"  # same ranges as requirements.txt
      - name: Setup SSH for signals repo
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SIGNALS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/signals_key
          chmod 600 ~/.ssh/signals_key
          printf "Host github-signals\n  HostName github.com\n  IdentityFile ~/.ssh/signals_key\n  StrictHostKeyChecking no\n" >> ~/.ssh/config
      - name: Clone signals repo
        if: steps.gate.outputs.configured == 'true'
        env:
          SIGNALS_REPO_URL: ${{ secrets.SIGNALS_REPO_URL }}
        run: |
          SSH_URL="${SIGNALS_REPO_URL/git@github.com/git@github-signals}"
          git clone "$SSH_URL" /tmp/signals
      - name: Check + alert
        if: steps.gate.outputs.configured == 'true'
        env:
          VAPID_PRIVATE_KEY_PEM: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
        run: |
          python - <<'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from pywebpush import webpush

          h = json.loads(Path("/tmp/signals/state/pipeline_health.json").read_text())
          ts = h.get("last_run_ts")
          if ts is None:
              print("health file has no last_run_ts")
              sys.exit(1)
          last = datetime.fromisoformat(ts)
          age = datetime.now(timezone.utc) - last
          if age <= timedelta(minutes=15):
              print(f"OK — last run {age.total_seconds()/60:.1f} min ago")
              sys.exit(0)
          subs_path = Path("/tmp/signals/state/push_subscriptions.json")
          if not subs_path.exists():
              print("Pipeline dead but no push subscribers")
              sys.exit(1)
          subs = json.loads(subs_path.read_text())
          payload = json.dumps({"title": "🛑 Pipeline dead", "body": f"Last run {int(age.total_seconds()/60)} min ago"})
          failed = 0
          for s in subs:
              try:
                  webpush(subscription_info=s, data=payload,
                          vapid_private_key=os.environ["VAPID_PRIVATE_KEY_PEM"],
                          vapid_claims={"sub": os.environ["VAPID_CONTACT"]})
              except Exception:  # the exception text can carry endpoints or keys: count only
                  failed += 1
          print(f"Pipeline dead; {failed} of {len(subs)} pushes failed")
          if failed == len(subs):  # nobody was alerted (no subscribers counts too)
              sys.exit(1)
          PYEOF
