[theme]
primaryColor = "#2196F3"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#fafafa"
font = "sans serif"

[server]
# headless/address/port intentionally not set so Streamlit Community Cloud
# can supply its own values. For local runs, start.sh passes flags directly.
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "stacktrace"  # surface errors clearly on Cloud + locally

[logger]
level = "info"
